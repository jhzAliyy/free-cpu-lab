name: Run Experiment

on:
  workflow_dispatch:
    inputs:
      samples:
        description: '每任务采样数(百万,每核)'
        required: false
        default: '100'
  push:
    paths:
      - 'experiment/**'

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show machine info
        run: |
          echo "CPU cores: $(nproc)"
          free -h | head -2
          cat /proc/cpuinfo | grep 'model name' | head -1

      - name: Run experiment (task ${{ matrix.task }})
        run: python experiment/run.py --task ${{ matrix.task }} --samples ${{ github.event.inputs.samples || '100' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-task-${{ matrix.task }}
          path: results/
          if-no-files-found: warn
